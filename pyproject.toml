[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcmod-mcp"
version = "0.1.0"
description = "REST API, MCP server and CLI for mcmod.cn (Minecraft Mod Wiki, SSR-only)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "mcmod-mcp contributors" }]
dependencies = [
  "beautifulsoup4>=4.12",
  "fastapi>=0.115",
  "httpx>=0.27",
  "lxml>=5.2",
  "mcp>=2.3",
  "pydantic-settings>=2.4",
  "pymysql>=1.1",
  "rich>=13.7",
  "sqlalchemy>=2.0",
  "typer>=0.12",
  "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
  "pytest>=8.2",
  "ruff>=0.6",
]

[project.scripts]
mcmod = "mcmod.cli:main"
mcmod-api = "mcmod.api:main"
mcmod-mcp = "mcmod.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcmod"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
